baseURL = "https://hackeradam.com"
title = "Adam Hacks"
author = "Adam Thompson"
theme = "hugo-blog-awesome"

enableRobotsTXT = true
enableEmoji = true

disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]
[permalinks]
  blog = "/blog/:slug/"
  tags = "/blog/:slug"

[params]
    sitename = "Adam Hacks"
    description = "The blog of Adam Thompson, a software/reverse engineer primarily interested in low-level systems and security."
    rssFeedDescription = "summary"
    logo = "glider.png"

    # hugo-blog-awesome
    defaultColor = "auto"       # dark | light | auto
    mainSections = ["blog"]
    toc = true
    tocOpen = false
    goToTop = true
    dateFormat = "Jan 2, 2006"

    [params.author]
        name = "Adam Thompson"
        avatar = "glider.png"
        intro = "Adam Thompson"
        description = "I'm a software/reverse engineer that loves poking at low-level systems."

    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/serialphotog"
    [[params.socialIcons]]
        name = "mastodon"
        url = "https://infosec.exchange/@serialphotog"
    [[params.socialIcons]]
        name = "Instagram"
        url = "https://www.instagram.com/adamhacksthings"
    [[params.socialIcons]]
        name = "RSS"
        url = "/index.xml"

[menu]
    # Primary navigation (site header).
    [[menu.main]]
        pageRef = "/blog"
        name = "Blog"
        weight = 10
    [[menu.main]]
        pageRef = "/references"
        name = "References"
        weight = 20
    [[menu.main]]
        pageRef = "/projects"
        name = "Projects"
        weight = 25
    [[menu.main]]
        pageRef = "/search"
        name = "Search"
        weight = 30
    [[menu.main]]
        pageRef = "/about"
        name = "About"
        weight = 40

    # Secondary navigation (site footer). GitHub and RSS are already
    # present as footer social icons, so they are not repeated here.
    [[menu.footer]]
        pageRef = "/blogroll"
        name = "Blogroll"
        weight = 10
    [[menu.footer]]
        url = "https://www.adamthompsonphoto.com"
        name = "Photography"
        weight = 20
    [[menu.footer]]
        pageRef = "/faq"
        name = "FAQ"
        weight = 30
    [[menu.footer]]
        pageRef = "/changelog"
        name = "Changelog"
        weight = 40

[markup]
  # Syntax highlighting is configured in config/_default/markup.toml
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[taxonomies]
    tags = 'tags'

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"

[minify]
    minifyOutput = true
