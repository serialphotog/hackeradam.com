{{- if and .IsPage .Params.toc }}
<!-- Dynamic TOC highlighting. -->
<script>
  (() => {
  const article = document.getElementById("post-content");
  const toc = document.getElementById("TableOfContents");

  if (!article || !toc) return;

  function throttle(fn, wait) {
    let time = 0;
    return function () {
      const now = Date.now();
      if (now - time >= wait) {
        fn();
        time = now;
      }
    };
  }

  const headings = Array.from(article.querySelectorAll("h2[id], h3[id]"));
  const links = new Map(
    Array.from(toc.querySelectorAll('a[href^="#"]')).map((link) => [
      decodeURIComponent(link.hash.slice(1)),
      link,
    ]),
  );

  function updateActiveLink() {
    const scrollTop = window.scrollY;
    let activeLink = null;

    for (const heading of headings) {
      if (scrollTop <= heading.offsetTop - 75) break;
      activeLink = links.get(heading.id) || activeLink;
    }

    for (const link of links.values()) {
      link.classList.toggle("active-toc", link === activeLink);
    }
  }

  updateActiveLink();
  window.addEventListener("scroll", throttle(updateActiveLink, 200), { passive: true });
  })();
</script>
{{- end }}
