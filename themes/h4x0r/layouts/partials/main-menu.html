<header class="site-head">
    {{- $logo := .Site.Params.logo | default "site-logo.png" -}}
    <a class="site-head-logo" href="{{ .Site.Home.RelPermalink }}" title="{{ .Site.Title }}">
        <img src="{{ relURL $logo }}" alt="{{ .Site.Params.logoAlt | default (printf "%s logo" .Site.Title) }}">
    </a>

    {{ with .Site.Menus.main }}
        <nav class="site-nav" aria-label="Primary">
            <ul>
                {{ range sort . "Weight" }}
                    {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
                    <li>
                        <a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
                    </li>
                {{ end }}
            </ul>
        </nav>
    {{ end }}
</header>
